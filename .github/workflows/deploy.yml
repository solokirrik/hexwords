name: Deploy to GitHub Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run build
            - uses: actions/configure-pages@v6
              if: github.event_name != 'pull_request'
            - uses: actions/upload-pages-artifact@v5
              if: github.event_name != 'pull_request'
              with:
                  path: build

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        # One deploy at a time; let a running one finish.
        concurrency:
            group: pages
            cancel-in-progress: false
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
